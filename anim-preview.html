<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ballast Motion Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: full-bleed 3D stage, one instrument panel docked left (bottom sheet on phones). */
  :root {
    --stage: #0d1114; --panel: #141a1f; --raise: #1c242b; --line: #2a343d;
    --fg: #d9e1e7; --dim: #8592a0; --visor: #3fd6e8; --sable: #ff4646;
    --display: 'Chakra Petch', 'Inter', system-ui, sans-serif;
    --body: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--stage); color: var(--fg); font: 13px/1.45 var(--body); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; outline: none; }
  .panel {
    position: fixed; z-index: 2; top: max(12px, env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px));
    bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: 300px; overflow-y: auto;
    background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 16px; backdrop-filter: blur(6px);
  }
  header h1 { font: 600 18px/1.1 var(--display); letter-spacing: .04em; margin: 0; text-transform: uppercase; }
  header p { margin: 4px 0 0; color: var(--dim); }
  .sec { display: flex; flex-direction: column; gap: 8px; }
  .sec > h2 { font: 600 11px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 0; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .seg.two { grid-template-columns: repeat(2, 1fr); }
  button {
    font: 500 12px/1 var(--body); color: var(--fg); background: var(--raise); border: 1px solid var(--line);
    border-radius: 6px; padding: 9px 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 6px;
  }
  .seg button { justify-content: center; }
  button:hover { border-color: #3d4a55; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--visor); outline-offset: 1px; }
  button[aria-pressed="true"] { border-color: var(--visor); color: #fff; background: color-mix(in srgb, var(--visor) 16%, var(--raise)); }
  button:disabled { opacity: .4; cursor: default; }
  kbd { font: 500 10px/1 var(--mono); color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 3px 4px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .actions button.danger[aria-pressed="true"] { border-color: var(--sable); background: color-mix(in srgb, var(--sable) 16%, var(--raise)); }
  .row { display: flex; align-items: center; gap: 10px; }
  .row label { width: 62px; color: var(--dim); }
  .row input[type=range] { flex: 1; min-width: 0; accent-color: var(--visor); }
  .row output { width: 64px; text-align: right; font: 500 11px/1 var(--mono); font-variant-numeric: tabular-nums; }
  .gait { font: 500 11px/1 var(--mono); color: var(--visor); letter-spacing: .06em; text-transform: uppercase; }
  .help { color: var(--dim); font-size: 12px; margin: 0; }
  .help kbd { margin-right: 2px; }
  #status { position: fixed; z-index: 2; right: max(12px, env(safe-area-inset-right, 0px)); top: max(12px, env(safe-area-inset-top, 0px)); font: 500 11px/1.6 var(--mono); color: var(--dim); text-align: right; pointer-events: none; }
  #loading[hidden] { display: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 3; font: 600 13px var(--display); letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
  @media (max-width: 720px) {
    .panel { top: auto; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; bottom: max(8px, env(safe-area-inset-bottom, 0px)); max-height: 46vh; }
    .help.keys { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading">Loading rigs…</div>
<aside class="panel" aria-label="Controls">
  <header>
    <h1>Motion Lab</h1>
    <p>Live game animation code: Mixamo library retargeted onto the Meshy cast.</p>
  </header>
  <section class="sec">
    <h2>Character</h2>
    <div class="seg" id="chars">
      <button id="c-ballast" data-style="ballast" aria-pressed="true">Frank</button>
      <button id="c-trooper" data-style="trooper">Trooper</button>
      <button id="c-spotter" data-style="spotter">Spotter</button>
      <button id="c-heavy" data-style="heavy">Heavy</button>
    </div>
    <div class="seg two" id="weapons">
      <button id="w-rifle" data-weapon="rifle" aria-pressed="true">Rifle <kbd>1</kbd></button>
      <button id="w-pistol" data-weapon="pistol">Sidearm <kbd>2</kbd></button>
    </div>
  </section>
  <section class="sec">
    <h2>Movement <span class="gait" id="gait">idle</span></h2>
    <div class="row"><label for="speed">Speed</label><input id="speed" type="range" min="0" max="7.5" step="0.1" value="0"><output id="sv">0.0 m/s</output></div>
    <div class="row"><label for="dir">Direction</label><input id="dir" type="range" min="-180" max="180" step="5" value="0"><output id="dv">0°</output></div>
    <div class="seg two">
      <button id="crouch" aria-pressed="false">Crouch <kbd>C</kbd></button>
      <button id="aim" aria-pressed="false">Aim <kbd>RMB</kbd></button>
    </div>
    <p class="help keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move relative to the body · <kbd>Shift</kbd> sprint · drag to orbit · wheel to zoom</p>
  </section>
  <section class="sec">
    <h2>Actions</h2>
    <div class="actions" id="actions">
      <button data-cue="fire">Fire <kbd>F</kbd></button>
      <button data-cue="reload">Reload <kbd>R</kbd></button>
      <button data-cue="throw">Throw <kbd>G</kbd></button>
      <button data-cue="slide" data-dur="0.6">Slide <kbd>Q</kbd></button>
      <button data-cue="vault" data-dur="0.3">Vault <kbd>Space</kbd></button>
      <button data-cue="mantle" data-dur="0.45">Mantle <kbd>E</kbd></button>
      <button data-cue="takedown" data-dur="0.55">Takedown <kbd>T</kbd></button>
      <button data-cue="melee">Melee <kbd>V</kbd></button>
      <button data-cue="hit">Hit react <kbd>H</kbd></button>
      <button data-cue="interact">Interact <kbd>X</kbd></button>
      <button id="stun" class="danger" aria-pressed="false">Stunned <kbd>B</kbd></button>
      <button id="dead" class="danger" aria-pressed="false">Dead <kbd>K</kbd></button>
    </div>
    <div class="row"><label for="slow">Time</label><input id="slow" type="range" min="0.1" max="1" step="0.05" value="1"><output id="slv">1.00×</output></div>
  </section>
</aside>
<div id="status"></div>
<script type="module" src="/tools/anim-preview.ts"></script>
</body>
</html>
